<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GTA VII — Liberty Shores 3D</title>
  <meta name="description" content="GTA VII — משחק נהיגה תלת-ממדי בעיר פתוחה. נבנה ב-Three.js / WebGL.">
  <link rel="stylesheet" href="styles/main.css">
  <script>
    // Surface load/runtime errors on the start screen instead of a silent hang.
    window.addEventListener("error", (e) => {
      var n = document.getElementById("load-note");
      if (n) n.textContent = "שגיאה בטעינה: " + (e.message || e.type) +
        " — ודא חיבור אינטרנט (Three.js נטען מ-CDN).";
    });
  </script>
</head>
<body>
  <div id="game-wrap">
    <!-- Three.js renderer canvas is injected here -->

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-box money">$<span id="money">0</span></div>
        <div class="hud-box wanted" id="wanted">
          <span class="star">★</span><span class="star">★</span><span class="star">★</span>
          <span class="star">★</span><span class="star">★</span>
        </div>
        <div class="hud-box health">
          <span class="hud-label">מצב הרכב</span>
          <div class="bar"><div id="health-bar" class="bar-fill hp"></div></div>
        </div>
      </div>
      <div class="hud-bottom">
        <div class="hud-box mission" id="mission-box">
          <span class="hud-label">משימה</span>
          <span id="mission-text">הגע לנקודה הזוהרת</span>
        </div>
        <div class="speed-cluster">
          <div class="hud-box daynight" id="daynight">☀️ <span class="hint">N</span></div>
          <div class="hud-box speedo"><span id="speed">0</span><small>קמ"ש</small></div>
        </div>
      </div>
      <div id="toast"></div>
    </div>

    <!-- Mobile controls -->
    <div id="touch-controls" class="hidden">
      <div class="pedals">
        <button class="tc gas" data-key="ArrowUp">⛽</button>
        <button class="tc brake" data-key="ArrowDown">⊟</button>
      </div>
      <div class="steer">
        <button class="tc left" data-key="ArrowLeft">◀</button>
        <button class="tc right" data-key="ArrowRight">▶</button>
      </div>
    </div>

    <!-- Loading / Start / Game over -->
    <div id="overlay" class="overlay">
      <div class="panel">
        <h1 class="logo">GTA <span>VII</span></h1>
        <p class="subtitle">Liberty Shores · 3D</p>
        <div id="overlay-body">
          <p class="how">עיר תלת-ממדית פתוחה. נהג ברחובות, השלם משימות, הרווח כסף — והיזהר מהמשטרה.</p>
          <ul class="controls-list">
            <li><b>חיצים / WASD</b> — גז, בלם והיגוי</li>
            <li><b>רווח</b> — בלם יד (סחרור)</li>
            <li><b>N</b> — מעבר יום / לילה</li>
            <li><b>C</b> — החלפת זווית מצלמה</li>
          </ul>
        </div>
        <button id="start-btn" class="big-btn" disabled>טוען עולם…</button>
        <p id="load-note" class="load-note">מאתחל מנוע גרפי…</p>
      </div>
    </div>
  </div>

  <!-- Three.js UMD build defines the global `THREE` for the classic script below -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
