<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הפתעה קטנה 🎁</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    h1.intro {
      color: #fff;
      margin-bottom: 30px;
      font-size: 1.6rem;
      text-shadow: 0 2px 10px rgba(0,0,0,.4);
      animation: floatIn 1s ease;
    }

    /* הקופסה */
    .box {
      width: 160px;
      height: 160px;
      cursor: pointer;
      position: relative;
      perspective: 600px;
      transition: transform .3s ease;
      animation: pulse 2s infinite;
    }
    .box:hover { transform: scale(1.08); }

    .box .lid,
    .box .base {
      position: absolute;
      left: 0;
      width: 100%;
      border-radius: 10px;
    }
    .box .base {
      bottom: 0;
      height: 110px;
      background: #e63946;
      box-shadow: inset 0 -10px 20px rgba(0,0,0,.25), 0 12px 25px rgba(0,0,0,.4);
    }
    .box .lid {
      top: 0;
      height: 55px;
      background: #d62839;
      box-shadow: 0 6px 12px rgba(0,0,0,.35);
      transform-origin: top center;
      transition: transform .5s ease;
      z-index: 2;
    }
    /* סרט */
    .ribbon-v {
      position: absolute;
      left: 50%;
      top: 0;
      width: 26px;
      height: 100%;
      background: #ffd166;
      transform: translateX(-50%);
      z-index: 3;
    }
    .ribbon-h {
      position: absolute;
      top: 38px;
      left: 0;
      width: 100%;
      height: 26px;
      background: #ffd166;
      z-index: 1;
    }
    .bow {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.4rem;
      z-index: 4;
    }

    /* כשנפתח */
    .box.open .lid { transform: rotateX(-130deg) translateY(-10px); }
    .box.open { animation: none; }

    /* ההודעה */
    .message {
      margin-top: 40px;
      max-width: 480px;
      background: rgba(255,255,255,.95);
      color: #2b1055;
      border-radius: 18px;
      padding: 28px 26px;
      box-shadow: 0 20px 45px rgba(0,0,0,.35);
      font-size: 1.15rem;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(20px) scale(.9);
      pointer-events: none;
      transition: all .6s cubic-bezier(.18,.89,.32,1.28);
    }
    .message.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .message .hi { font-size: 1.45rem; font-weight: 700; margin-bottom: 10px; }
    .message .wait { margin-top: 14px; color: #7b2cbf; font-style: italic; }
    .heart { color: #e63946; }

    /* אנימציות */
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* קונפטי */
    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 16px;
      opacity: .9;
      animation: fall linear forwards;
      z-index: 0;
    }
    @keyframes fall {
      to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1 class="intro">יש לך הפתעה קטנה... 👀<br>לחצי על הקופסה</h1>

  <div class="box" id="box" onclick="openGift()">
    <div class="bow">🎀</div>
    <div class="lid"></div>
    <div class="ribbon-h"></div>
    <div class="base"></div>
    <div class="ribbon-v"></div>
  </div>

  <div class="message" id="message">
    <div class="hi">היי ליאל 👋</div>
    לא שמעת על המושג <b>"לא פותחים דבר שלא יודעים"</b>? 🙃<br>
    אבל זה בסדר — כי זה אני, הפעם אמחל לך <span class="heart">❤️</span>
    <div class="wait">( ממתין לך בצ'אט בינתיים 😏 )</div>
  </div>

  <script>
    let opened = false;
    function openGift() {
      if (opened) return;
      opened = true;
      document.getElementById('box').classList.add('open');
      setTimeout(() => {
        document.getElementById('message').classList.add('show');
        launchConfetti();
      }, 450);
    }

    function launchConfetti() {
      const colors = ['#ffd166','#e63946','#06d6a0','#118ab2','#ef476f','#fff'];
      for (let i = 0; i < 80; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        c.style.animationDelay = (Math.random() * .6) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4500);
      }
    }
  </script>
</body>
</html>
