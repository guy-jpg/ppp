<script>
OM.music({ src: 'assets/music/dg-cue.wav', name: 'Forward Drive (cut for this film)', start: 0, arrange: 'off', bpm: 120, fade: 0.15 });
const V = OM.vars();
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

// ---------- the prints (generated once, deterministic) ----------
const LEO = DGPrints.leopard(1620, 2880, 7);
const ZEB = DGPrints.zebra(1080, 1920, 3);
const TILE = DGPrints.majolicaSVG();
$('#leo1').style.background = `url(${LEO}) 0 0 / 1080px 1920px`;
$('#pLeoB').style.backgroundImage = `url(${LEO})`;
$('#pZeb').style.backgroundImage = `url(${ZEB})`;
['#tiles', '#pTile', '#pTile2'].forEach((s) => { $(s).style.backgroundImage = `url(${TILE})`; });
$$('.leoImg').forEach((el) => el.setAttribute('href', LEO));
$$('.tileImg').forEach((el) => el.setAttribute('href', TILE));
const decode = (src) => { const i = new Image(); i.src = src; return i.decode().catch(() => {}); };
const ready = Promise.all([decode(LEO), decode(ZEB), decode(TILE), document.fonts.ready]);

// ---------- DOLCE in white, one letter at a time, at the knockout's exact glyph positions ----------
const dk = $('#dkText');
const whiteLetters = [];
'DOLCE'.split('').forEach((ch, i) => {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('class', 'anton'); t.setAttribute('font-size', '380'); t.setAttribute('y', '1180');
  t.style.fill = 'var(--paper)'; t.textContent = ch;
  $('#dolceWhite').appendChild(t); whiteLetters.push(t);
});
function placeLetters() {
  for (let i = 0; i < 5; i++) { const b = dk.getExtentOfChar(i); whiteLetters[i].setAttribute('x', b.x.toFixed(2)); }
}
placeLetters();
(OM.ready || ((p) => p))(ready.then(placeLetters));

// ---------- timeline ----------
const B = (n) => n * 0.5;           // 120 bpm on the cue's own grid (assets/music/dg-cue.wav: bar lines at 0, 2, 4 … s)
const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
const show = (sel, at) => tl.set(sel, { opacity: 1 }, at);
const hide = (sel, at) => tl.set(sel, { opacity: 0 }, at);

// scene 1 · hook: leopard full bleed, camera pulling back; DOLCE slams in letter by letter, then the print collapses into it
tl.addLabel('scene:hook', 0);
tl.fromTo('#w1world', { scale: 1.32 }, { scale: 1, duration: B(4), ease: 'expo.out', immediateRender: true }, 0);
whiteLetters.forEach((el, i) => {
  tl.fromTo(el, { y: i === 0 ? 90 : 560 }, { y: 0, duration: 0.34, ease: 'expo.out', immediateRender: true }, i === 0 ? 0 : B(0.5 * i) - 0.04);
});
tl.set('#s1black', { attr: { opacity: 1 } }, B(2));
tl.set('#dolceKnock', { attr: { opacity: 1 } }, B(2));
tl.set('#dolceWhite', { opacity: 0 }, B(2));
OM.sfx('thud', B(2), { gain: 0.8 });
// the leopard keeps moving inside the letters
tl.fromTo('#dolceKnock', { scale: 1.12, transformOrigin: '50% 50%' }, { scale: 1, duration: B(2), ease: 'power3.out', immediateRender: false }, B(2));
const drift1 = { v: 0 };
tl.fromTo(drift1, { v: 0 }, { v: 1, duration: B(2), ease: 'power1.in', immediateRender: false,
  onUpdate() { $('#patLeo1').setAttribute('patternTransform', `translate(0 ${(-190 * drift1.v).toFixed(2)})`); } }, B(2));

// scene 2 · the black ground collapses into a band; the maiolica floor rises; GABBANA slams in
tl.addLabel('scene:tiles', B(4));
tl.set('#s1black', { attr: { opacity: 0 } }, B(4));
hide('#leo1', B(4));
tl.fromTo('#band', { scaleY: 1920 / 340 }, { scaleY: 1, duration: 0.42, ease: 'expo.inOut', immediateRender: true }, B(4));
tl.fromTo('#dolceKnock', { y: 0 }, { y: -1300, duration: 0.34, ease: 'power3.in', immediateRender: false }, B(4));
tl.set('#dolceKnock', { attr: { opacity: 0 } }, B(4) + 0.36);
tl.fromTo('#tiles', { rotationX: 72, rotationZ: 14, z: -300 }, { rotationX: 0, rotationZ: 0, z: 0, duration: B(3), ease: 'expo.out', immediateRender: true }, B(4));
tl.fromTo('#tiles', { y: 0 }, { y: -420, duration: B(4), ease: 'none', immediateRender: true }, B(4));
show('#wGab', B(4) + 0.12);
tl.fromTo('#wGab', { yPercent: 100 }, { yPercent: 0, duration: 0.3, immediateRender: false }, B(4) + 0.12);
tl.fromTo('#wGab', { letterSpacing: '4px' }, { letterSpacing: '18px', duration: B(3), ease: 'power1.inOut', immediateRender: false }, B(5));
OM.sfx('whoosh', B(4), { gain: 0.7 });

// scene 3 · burst: the band holds still, the house prints change behind it on every beat
tl.addLabel('scene:burst', B(8));
hide('#floor', B(8)); hide('#wGab', B(8));
const shots = [
  { p: '#pRed', w: '#w1', from: { scale: 1.14 }, to: { scale: 1 } },
  { p: '#pTile', w: '#w2', from: { rotation: -9, scale: 1.18 }, to: { rotation: 0, scale: 1 } },
  { p: '#pZeb', w: '#w3', from: { x: -150 }, to: { x: 0 } },
  { p: '#pGold', w: '#w4', from: { scale: 1.12 }, to: { scale: 1 } },
  { p: '#pDots', w: '#w5', from: { y: -110 }, to: { y: 0 } },
];
shots.forEach((s, i) => {
  const at = B(8 + i);
  show(s.p, at); show(s.w, at);
  if (i) { hide(shots[i - 1].p, at); hide(shots[i - 1].w, at); }
  tl.fromTo(s.p, s.from, { ...s.to, duration: B(1), ease: 'power2.out', immediateRender: false }, at);
  tl.fromTo(s.w, { yPercent: 70, scaleX: 1.25 }, { yPercent: 0, scaleX: 1, duration: 0.2, immediateRender: false }, at);
  OM.sfx('hit', at, { gain: 0.55, pitch: 1 + i * 0.05 });
});
tl.fromTo('#pGold .sheen', { x: 0 }, { x: 1900, duration: B(1), ease: 'power2.inOut', immediateRender: false }, B(11));
// accelerate: four half-beat flashes, no words, the band thins
const flashes = [
  { p: '#pLeoB', from: { scale: 1.2 }, to: { scale: 1.05 } },
  { p: '#pTile2', from: { rotation: 12, scale: 1.3 }, to: { rotation: 6, scale: 1.2 } },
  { p: '#pRed', from: { scale: 1.1 }, to: { scale: 1 } },
  { p: '#pZeb', from: { x: 120 }, to: { x: 40 } },
];
hide('#pDots', B(13)); hide('#w5', B(13));
flashes.forEach((f, i) => {
  const at = B(13 + i * 0.5);
  show(f.p, at); if (i) hide(flashes[i - 1].p, at);
  tl.fromTo(f.p, f.from, { ...f.to, duration: B(0.5), ease: 'none', immediateRender: false }, at);
  OM.sfx('tick', at, { gain: 0.6, pitch: 1.1 + i * 0.08 });
});
tl.fromTo('#band', { scaleY: 1 }, { scaleY: 0.34, duration: B(2), ease: 'power2.in', immediateRender: false }, B(13));

// the stop: the band swallows the frame, one small gold ampersand
tl.addLabel('scene:stop', B(15));
tl.fromTo('#band', { scaleY: 0.34 }, { scaleY: 1920 / 340 + 0.2, duration: 0.2, ease: 'expo.out', immediateRender: false }, B(15));
hide('#pZeb', B(15) + 0.2);
show('#hero', B(15) + 0.06);
tl.set(['#hD', '#hG'], { opacity: 0 }, B(15) + 0.06);
tl.set('#hRules', { opacity: 0 }, 0);
tl.fromTo('#hA', { scale: 0.32, opacity: 0, transformOrigin: '50% 50%' }, { scale: 0.42, opacity: 1, duration: B(1), ease: 'power2.out', immediateRender: true }, B(15) + 0.06);

// the drop: DOLCE from above in leopard, GABBANA from below in maiolica, the ampersand springs to full size
tl.addLabel('scene:drop', B(16));
tl.set(['#hD', '#hG'], { opacity: 1 }, B(16));
tl.fromTo('#hD', { y: -900 }, { y: 0, duration: 0.32, immediateRender: false }, B(16));
tl.fromTo('#hG', { y: 900 }, { y: 0, duration: 0.32, immediateRender: false }, B(16));
tl.fromTo('#hA', { scale: 0.42 }, { scale: 1, duration: 0.9, ease: OM.spring(0.22), immediateRender: false }, B(16));
tl.fromTo('#hero', { scale: 1.16, transformOrigin: '50% 50%' }, { scale: 1, duration: B(4), ease: 'expo.out', immediateRender: false }, B(16));
OM.sfx('reverse', B(16), { gain: 0.7, dur: 0.5 });
OM.sfx('impact', B(16) + 0.001, { gain: 0.9 });
// the prints keep living inside the letters
const drift = { v: 0 };
tl.fromTo(drift, { v: 0 }, { v: 1, duration: B(6), ease: 'none', immediateRender: false,
  onUpdate() {
    $('#patLeo2').setAttribute('patternTransform', `translate(${(-70 * drift.v).toFixed(2)} ${(-230 * drift.v).toFixed(2)})`);
    $('#patTile').setAttribute('patternTransform', `translate(${(180 * drift.v).toFixed(2)} 0)`);
  } }, B(16));
// bar 4½: gold rules open out from the ampersand; the camera leans in
tl.set('#hRules', { opacity: 1 }, B(18));
tl.fromTo('#ruleL', { scaleX: 0, transformOrigin: '100% 50%' }, { scaleX: 1, duration: 0.6, immediateRender: false }, B(18));
tl.fromTo('#ruleR', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.6, immediateRender: false }, B(18));
OM.sfx('draw', B(18), { gain: 0.45, dur: 0.5 });
tl.fromTo('#heroCam', { scale: 1, transformOrigin: '50% 50%' }, { scale: 1.07, duration: B(4), ease: 'none', immediateRender: false }, B(18));
tl.fromTo('#hA text', { rotation: -5, transformOrigin: '50% 60%' }, { rotation: 4, duration: B(6), ease: 'sine.inOut', immediateRender: false }, B(16));

// bar 5: the prints swap letters on the beat
tl.set('#hD text', { attr: { fill: 'url(#patTile)' } }, B(20));
tl.set('#hG text', { attr: { fill: 'url(#patLeo2)' } }, B(20));
tl.fromTo('#hero', { scale: 1.05 }, { scale: 1, duration: B(2), ease: 'expo.out', immediateRender: false }, B(20));
OM.sfx('hit', B(20), { gain: 0.5 });

// the squeeze: the stack folds into the lockup
tl.addLabel('scene:lockup', B(22));
tl.fromTo('#hD', { y: 0 }, { y: 150, duration: 0.42, ease: 'power3.inOut', immediateRender: false }, B(22));
tl.fromTo('#hG', { y: 0 }, { y: -150, duration: 0.42, ease: 'power3.inOut', immediateRender: false }, B(22));
tl.fromTo('#hero', { scale: 1, opacity: 1 }, { scale: 0.2, opacity: 0, duration: 0.42, ease: 'power3.inOut', immediateRender: false }, B(22));
show('#lock', B(22) + 0.2);
tl.fromTo('#lock', { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.7, immediateRender: false }, B(22) + 0.2);
tl.fromTo('#lock .lw', { letterSpacing: '0.6em' }, { letterSpacing: '0.16em', duration: 1.3, immediateRender: false }, B(22) + 0.2);
OM.sfx('whip', B(22), { gain: 0.55 });
// bar 6, on the track's home-chord hit: the rule and the city
tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.7, immediateRender: true }, B(24));
tl.fromTo('#tag', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, immediateRender: true }, B(24) + 0.1);
OM.sfx('chime', B(24), { gain: 0.45 });
// the camera keeps leaning in on the mark until the last frame
tl.fromTo('#endCam', { scale: 1 }, { scale: 1.1, duration: B(24) + V.endHold - B(22) - 0.3, ease: 'none', immediateRender: true }, B(22) + 0.3);
