name: Deploy PWA to GitHub Pages

# מפרסם את אפליקציית "שגרת היום" (PWA) ל-GitHub Pages.
# מפרסם את תוכן daily-routine/www לשורש האתר, כך שה-URL יהיה:
#   https://<user>.github.io/<repo>/

on:
  push:
    branches:
      - main
      - claude/zen-ritchie-o6ass6
    paths:
      - 'daily-routine/www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# מאפשר ריצה אחת בכל פעם, ללא ביטול פריסה שכבר רצה
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: daily-routine/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
