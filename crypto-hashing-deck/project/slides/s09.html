<h2 class="t" style="font-size:44px; font-weight:700; color:#22D3EE">השאלה שגיבוב קריפטוגרפי עונה עליה</h2>
<div class="col" style="flex:1; justify-content:center; gap:36px">
<p class="qm rise" style="--i:1">”</p>
<p class="q rise" style="--i:2; width:1500px; align-self:flex-end">&#8235;מה קורה כשמי שמשנה את הנתונים הוא אדם חכם עם מחשבים חזקים?&#8236;</p>
<div class="rise" style="--i:4; height:2px; width:1500px; align-self:flex-end; background:rgba(148,163,184,.25)"></div>
<p class="rise" style="--i:5; font-size:44px; font-weight:600; line-height:1.4; color:#FBBF24; width:1500px; align-self:flex-end">&#8235;הדרישה: גם תוקף עם כל משאבי העולם לא יוכל למצוא קלט אחר עם אותו גיבוב.&#8236;</p>
</div>
<aside>&#8235;’כל משאבי העולם’ זה לא ביטוי ספרותי — הביטחון נמדד מול כל כוח החישוב שקיים, ושיהיה קיים בעשורים הקרובים.&#8236;</aside>
</section>
